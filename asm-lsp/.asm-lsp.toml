# Global asm-lsp configuration. setup.sh symlinks this file to
# ~/.config/asm-lsp/.asm-lsp.toml.
#
# The assembly in this setup is RISC-V GNU as, but asm-lsp otherwise defaults
# to the host architecture (x86-64) and would not know any RISC-V instruction.
[default_config]
assembler = "gas"
instruction_set = "riscv"

[default_config.opts]
# Do not fall back to the host `gcc` when a project has no compiler flags:
# it would reject every RISC-V instruction as invalid. Projects get real
# assembler diagnostics from their own .asm-lsp.toml, which names a RISC-V
# `compiler` and either `compile_flags_txt` or a compilation database. Run
# :RiscvAsmDoctor in Neovim to see what is missing.
default_diagnostics = false
