[terminal.shell]
program = "powershell.exe"

# Default shell is PowerShell, so that entering the WSL sandbox (via `wsl`)
# and later exiting it drops back to a live PowerShell prompt instead of
# closing the window - the window only closes when PowerShell itself exits.
# A separate "Alacritty (WSL)" shortcut (see windows/setup.ps1) launches
# straight into WSL for a WSL-only window instead.

# Allow apps inside the terminal (nvim, tmux, the Copilot CLI's own
# click-to-copy, etc.) to write to the real Windows clipboard via OSC 52
# escape sequences. Needed on top of tmux's `set-clipboard external` and the
# win32yank.exe bridge - some tools (like Copilot CLI's own copy-on-click)
# use OSC 52 directly instead of relying on tmux copy-mode/copy-command.
[terminal]
osc52 = "CopyPaste"

[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"
