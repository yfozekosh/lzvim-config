# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'
setw -g mouse on

set -g default-terminal "screen-256color"
set -as terminal-overrides ',*:Tc'

set -g @plugin 'alexwforsythe/tmux-which-key'
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# WSL clipboard bridge: pipe all tmux copies (mouse-drag select+release AND
# copy-mode 'y') through win32yank.exe so they land in the real Windows
# clipboard, shared with Alacritty and nvim. copy-command is a global
# fallback used for ANY copy-to-buffer action (not just copy-pipe bindings),
# so this also fixes mouse-selection copies, not just the 'y' binding below.
#
# This whole block is conditional on win32yank.exe actually existing. On a
# native (non-WSL) machine the binary is absent - install_win32yank in
# setup.sh skips installing it there - and pointing copy-command at a missing
# binary breaks copying to the *system* clipboard: tmux still fills its own
# paste buffer, so nothing looks wrong, but nothing reaches the outer
# terminal or other apps either. On non-WSL we therefore clear copy-command
# (so tmux uses its own buffer, the normal default) and drop the OSC 52
# relay hook, which lets tmux pass OSC 52 straight through to the outer
# terminal - correct behaviour off WSL.
if-shell 'command -v win32yank.exe >/dev/null 2>&1' {
  set -s copy-command 'win32yank.exe -i --crlf'
  bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'win32yank.exe -i --crlf'

  # NOTE on right-click copy (e.g. inside the Copilot CLI): with `mouse on`,
  # tmux claims every mouse click for panes whose app hasn't itself requested
  # mouse tracking, so a plain right-click never reaches Alacritty's or the
  # app's own native right-click-to-copy handling - there's no tmux binding
  # that can restore that, since tmux is deliberately consuming the event
  # before the terminal ever sees it. To get real native right-click-copy,
  # hold Shift while right-clicking: Alacritty always treats a Shift+click as
  # a request to bypass tmux/the app entirely and handle it itself.

  # Some apps (e.g. the Copilot CLI's own click-to-copy) write to the
  # clipboard via an OSC 52 escape sequence instead of tmux's copy-command
  # path. Normally tmux would relay that straight to the outer terminal, but
  # OSC 52 gets silently dropped somewhere in the WSL<->Windows conpty layer
  # that Alacritty's wsl.exe integration goes through - a known, unfixable-
  # from-here platform limitation (see alacritty/alacritty#7962). So instead:
  # tell tmux to also capture OSC 52 writes into its own paste buffer
  # (set-clipboard on), and hook pane-set-clipboard (fires whenever that
  # happens) to pipe the newly-set buffer through win32yank.exe, which does
  # reach the real Windows clipboard.
  set-option -g set-clipboard on
  set-hook -g pane-set-clipboard 'run-shell "tmux save-buffer - | win32yank.exe -i --crlf"'
} {
  # Re-sourcing this file on a non-WSL host has to actively CLEAR the WSL
  # settings, not just skip setting them: server options AND bindings survive
  # a re-source, so a stale copy-command / 'y' binding set during an earlier
  # WSL session would otherwise keep breaking every copy. Clearing
  # copy-command restores tmux's default behaviour (copy into tmux's own
  # buffer); set-clipboard external + no hook lets OSC 52 pass straight
  # through to the outer terminal, which is correct off WSL.
  set -s copy-command ''
  set-option -g set-clipboard external
  set-hook -gu pane-set-clipboard
  # The WSL branch binds 'y' to `copy-pipe-and-cancel "win32yank.exe ..."`,
  # which passes the pipe as an explicit argument and therefore ignores
  # copy-command entirely. It must be actively rebound here, not just left
  # alone: copy-selection-and-cancel puts the text in tmux's own buffer and
  # works with no external helper binary, which is what you want off WSL.
  bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
}


# Window auto-naming: default to running program, but show "ai-<dir>" for
# copilot/opencode and "claude-<dir>" for the Claude Code CLI
set -g automatic-rename on
set -g automatic-rename-format '#(~/.tmux/scripts/window-name.sh #{pane_pid} #{pane_current_path} #{pane_current_command})'

set -g status-interval 2
set -g status-bg "#3B4252"
set -g status-fg "#D8DEE9"
set -g message-style "bg=#3B4252,fg=#D8DEE9"
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#81A1C1"
set -g window-status-current-style "fg=#A3BE8C,bg=#3B4252,bold"
set -g status-left "#[fg=#88C0D0,bg=#3B4252,bold] #S #[default]"
set -g status-right "#[fg=#A3BE8C,bg=#3B4252] #{=/-20/...:pane_current_path} #[fg=#D8DEE9,bg=#3B4252] %Y-%m-%d %H:%M #[fg=#81A1C1,bg=#3B4252] Docker:[#(~/.tmux/scripts/docker-count.sh)] #[fg=#EBCB8B,bg=#3B4252]#(~/.tmux/scripts/copilot-usage.sh #{window_id}) #(~/.tmux/scripts/claude-usage.sh #{window_id}) #(tmux-mem-cpu-load --colors --powerline-right --interval 2 -a 0)#[default]"
set -g status-right-length 200

bind b last-window

# Pane navigation with vim keys (Ctrl+b h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Remove repeatable pane movement
set -g repeat-time 0
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
